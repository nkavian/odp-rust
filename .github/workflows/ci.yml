name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.85.0"
          - stable
    steps:
      - uses: actions/checkout@v7

      - name: Check out ODP specifications
        uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-specs
          path: .conformance/odp-specs

      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt

      - name: Verify workspace
        run: make verify
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

      - name: Run shared conformance harness
        run: make conformance
        env:
          ODP_SPECS_DIR: .conformance/odp-specs
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

      - name: Upload conformance reports
        if: matrix.rust == '1.85.0'
        uses: actions/upload-artifact@v7
        with:
          name: odp-rust-conformance
          path: .conformance/reports/*.json
          if-no-files-found: error
          retention-days: 7
